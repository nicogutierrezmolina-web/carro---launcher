plugins {
    id 'com.android.application'
}

android {
    namespace 'com.micar.launcher'
    compileSdk 33

    defaultConfig {
        applicationId 'com.micar.launcher'
        minSdk 21
        targetSdk 23
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
