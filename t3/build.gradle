plugins {
    id 'com.android.application'
}

android {
    namespace 'com.micar.t3'
    compileSdk 33

    defaultConfig {
        applicationId 'com.micar.t3'
        minSdk 21
        targetSdk 23
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
