name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Compilar APKs
        run: gradle assembleDebug --no-daemon

      - name: Reunir APKs
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/
          cp t1/build/outputs/apk/debug/t1-debug.apk salida/
          cp t2/build/outputs/apk/debug/t2-debug.apk salida/

      - name: Guardar APKs
        uses: actions/upload-artifact@v4
        with:
          name: CarroLauncher-APK
          path: salida/
